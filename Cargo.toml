# macfs-plugins – pluginy pro souborové manažery (Total Commander, Altap/Open Salamander) pro souborové systémy a archivy macOS: HFS+/HFSX a APFS (jen čtení), obrazy DMG/UDIF (čtení i zápis na úrovni oddílů), instalační balíčky PKG (XAR + PBZX/CPIO, jen čtení), další přibudou.
[workspace]
resolver = "3"
members = ["crates/macfs-core", "crates/macfs-wcx", "crates/macfs-spl"]
exclude = ["vendor/hfsplus", "vendor/apfs"] # upstream cratey s lokálními patchi (viz PATCHES.md v adresářích), nejsou členy workspace

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
hfsplus = { path = "vendor/hfsplus", version = "=0.4.0" }
apfs = { path = "vendor/apfs", version = "=0.4.1" }
udif = "=0.4.2" # kontejner UDIF (DMG): čtení i zápis oddílů
# dekodéry bloků UDIF pro líné čtení DMG (stejné verze jako v crate udif, aby se nelinkovaly dvakrát)
flate2 = "1"
bzip2 = "0.6"
lzfse_rust = "0.2"
lzma-rust2 = "0.21"
# instalační balíčky PKG: kontejner XAR (TOC + heap); dekódování payloadu PBZX/CPIO si dělá macfs-core sám (streamovaně)
xara = { version = "=0.4.2", default-features = false }
quick-xml = "0.42" # stejná verze jako v crate xara (čtení PackageInfo / Distribution)
pbzx = { version = "=0.5.1", default-features = false, features = ["pack"] } # jen pro testy (tvorba syntetických payloadů)
unicode-normalization = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Time",
] }
macfs-core = { path = "crates/macfs-core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind" # MUSÍ zůstat "unwind": exportované funkce pluginů používají catch_unwind, aby chyba nikdy nesrazila hostitelskou aplikaci (panic unikající skrz extern "system" by proces ukončil).