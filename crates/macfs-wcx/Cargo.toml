[package]
name = "macfs-wcx"
description = "macfs-plugins: Total Commander WCX plugin, read-only přístup k HFS+/HFSX svazkům a APFS kontejnerům (64 bit)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "macfs_wcx"  # cdylib = vlastní DLL pluginu (přejmenuje se na .wcx64), rlib = aby ho mohl linkovat `cargo test`
crate-type = ["cdylib", "rlib"]

[dependencies]
macfs-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
macfs-core = { workspace = true, features = ["testutil"] }
udif.workspace = true
apfs = { workspace = true, features = ["testutil"] }
hfsplus = { workspace = true, features = ["testutil"] }
hfs-reader = { workspace = true, features = ["testutil"] }
macfs.workspace = true
