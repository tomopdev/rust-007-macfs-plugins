[package]
name = "macfs-spl"
description = "macfs-plugins: plugin (.spl) pro Open Salamander / Altap Salamander, read-only přístup k HFS+/HFSX svazkům a APFS kontejnerům (64 bit)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "macfs_spl"
crate-type = ["cdylib", "rlib"] # cdylib = vlastní DLL pluginu (přejmenuje se na .spl), rlib = aby ho mohl linkovat `cargo test`

[dependencies]
macfs-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
udif.workspace = true
apfs = { workspace = true, features = ["testutil"] }
hfsplus = { workspace = true, features = ["testutil"] }
